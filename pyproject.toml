[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra-studio"
version = "0.1.0"
description = "Local AI Video Studio - Desktop video generation application powered by Python and Tauri"
authors = [{ name = "Veyra Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psutil>=5.9.8",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "huggingface_hub==0.36.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
